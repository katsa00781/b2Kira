<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center">
  <div style="position:relative; width:90px; height:90px; transform:scale({{ scale }}); transition:transform .15s linear">
    <div style="position:absolute; top:-14px; left:-4px; width:30px; height:30px; background:#3A3A3A; border-radius:50%"></div>
    <div style="position:absolute; top:-14px; right:-4px; width:30px; height:30px; background:#3A3A3A; border-radius:50%"></div>
    <div style="position:absolute; inset:0; background:#FFFFFF; border:3px solid #E9E9E9; border-radius:50%; box-shadow:0 6px 14px rgba(150,150,150,.3)"></div>
    <div style="position:absolute; top:24px; left:10px; width:22px; height:26px; background:#3A3A3A; border-radius:50%; transform:rotate(-8deg)"></div>
    <div style="position:absolute; top:24px; right:10px; width:22px; height:26px; background:#3A3A3A; border-radius:50%; transform:rotate(8deg)"></div>
    <div style="position:absolute; top:34px; left:17px; width:9px; height:9px; background:#fff; border-radius:50%"></div>
    <div style="position:absolute; top:34px; right:17px; width:9px; height:9px; background:#fff; border-radius:50%"></div>
    <div style="position:absolute; top:46px; left:41px; width:8px; height:6px; background:#3A3A3A; border-radius:50%"></div>
    <div style="position:absolute; top:53px; left:45px; width:2px; height:8px; background:#D8D8D8"></div>
    <div style="position:absolute; top:59px; left:33px; width:10px; height:6px; border-bottom:2.5px solid #D8D8D8; border-radius:0 0 50% 50%"></div>
    <div style="position:absolute; top:59px; left:47px; width:10px; height:6px; border-bottom:2.5px solid #D8D8D8; border-radius:0 0 50% 50%"></div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:150,&quot;height&quot;:150},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;happy&quot;,&quot;options&quot;:[&quot;happy&quot;,&quot;breathing&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;scale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:1.5,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;}}"></script>
</body>
</html>
