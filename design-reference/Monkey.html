<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center">
  <div style="position:relative; width:90px; height:90px; transform:scale({{ scale }}); transition:transform .15s linear">
    <div style="position:absolute; top:20px; left:-16px; width:26px; height:30px; background:#B98559; border:3px solid #A5713F; border-radius:50%"></div>
    <div style="position:absolute; top:20px; right:-16px; width:26px; height:30px; background:#B98559; border:3px solid #A5713F; border-radius:50%"></div>
    <div style="position:absolute; inset:0; background:#B98559; border:3px solid #A5713F; border-radius:50%; box-shadow:0 6px 14px rgba(150,110,70,.3)"></div>
    <div style="position:absolute; top:20px; left:14px; width:62px; height:52px; background:#F3DCB8; border-radius:50% 50% 46% 46%"></div>
    <div style="position:absolute; top:32px; left:24px; width:11px; height:11px; background:#4A2E17; border-radius:50%"></div>
    <div style="position:absolute; top:32px; right:24px; width:11px; height:11px; background:#4A2E17; border-radius:50%"></div>
    <div style="position:absolute; top:47px; left:41px; width:8px; height:6px; background:#7A5230; border-radius:50%"></div>
    <div style="position:absolute; top:59px; left:33px; width:10px; height:6px; border-bottom:2.5px solid #8A6238; border-radius:0 0 50% 50%"></div>
    <div style="position:absolute; top:59px; left:47px; width:10px; height:6px; border-bottom:2.5px solid #8A6238; border-radius:0 0 50% 50%"></div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:150,&quot;height&quot;:150},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;happy&quot;,&quot;options&quot;:[&quot;happy&quot;,&quot;breathing&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;scale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:1.5,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;}}"></script>
</body>
</html>
