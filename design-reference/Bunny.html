<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center">
  <div style="position:relative; width:90px; height:90px; transform:scale({{ scale }}); transition:transform .15s linear">
    <div style="position:absolute; top:-38px; left:6px; width:22px; height:44px; background:#FFFFFF; border:3px solid #F3D8EE; border-radius:14px 14px 10px 10px; transform:rotate(-14deg)">
      <div style="position:absolute; inset:6px 7px; background:#FFD3E8; border-radius:10px"></div>
    </div>
    <div style="position:absolute; top:-38px; right:6px; width:22px; height:44px; background:#FFFFFF; border:3px solid #F3D8EE; border-radius:14px 14px 10px 10px; transform:rotate(14deg)">
      <div style="position:absolute; inset:6px 7px; background:#FFD3E8; border-radius:10px"></div>
    </div>
    <div style="position:absolute; inset:0; background:#FFFFFF; border:3px solid #F3D8EE; border-radius:50%; box-shadow:0 6px 14px rgba(200,160,210,.3)"></div>
    <div style="position:absolute; top:32px; left:16px; width:11px; height:11px; background:#5B3E66; border-radius:50%"></div>
    <div style="position:absolute; top:32px; right:16px; width:11px; height:11px; background:#5B3E66; border-radius:50%"></div>
    <div style="position:absolute; top:38px; left:6px; width:16px; height:12px; background:#FFC2DB; border-radius:50%; opacity:.8"></div>
    <div style="position:absolute; top:38px; right:6px; width:16px; height:12px; background:#FFC2DB; border-radius:50%; opacity:.8"></div>
    <div style="position:absolute; top:46px; left:41px; width:8px; height:6px; background:#F6A9C6; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%"></div>
    <div style="position:absolute; top:53px; left:45px; width:2px; height:8px; background:#E8B8CE"></div>
    <div style="position:absolute; top:59px; left:33px; width:10px; height:6px; border-bottom:2.5px solid #E8B8CE; border-radius:0 0 50% 50%"></div>
    <div style="position:absolute; top:59px; left:47px; width:10px; height:6px; border-bottom:2.5px solid #E8B8CE; border-radius:0 0 50% 50%"></div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:150,&quot;height&quot;:150},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;happy&quot;,&quot;options&quot;:[&quot;happy&quot;,&quot;breathing&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;scale&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.5,&quot;max&quot;:1.5,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;}}"></script>
</body>
</html>
